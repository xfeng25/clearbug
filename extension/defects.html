<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Defect log · ClearBug</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--border); }
    header.top .left { display: flex; align-items: center; gap: 14px; }
    header.top h1 { font-size: 17px; }
    main { max-width: 1300px; margin: 0 auto; padding: 20px 24px 60px; }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
    .stats { display: flex; gap: 8px; flex-wrap: wrap; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 13px; }
    .stat b { font-size: 16px; margin-right: 4px; }
    .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--surface-2); white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    td.id a { font-weight: 700; text-decoration: none; white-space: nowrap; }
    td.title { min-width: 260px; }
    td select { padding: 4px 6px; font-size: 13px; width: auto; }
    .empty { padding: 50px 20px; text-align: center; color: var(--muted); }
    .empty ol { display: inline-block; text-align: left; margin: 10px 0 0; }
  </style>
</head>
<body>
  <header class="top">
    <div class="left">
      <div class="brand"><img src="icons/icon32.png" alt="">ClearBug</div>
      <h1>Defect log</h1>
    </div>
    <a href="options.html">Settings</a>
  </header>
  <main>
    <div class="bar">
      <div class="stats" id="stats"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button id="export-sel" disabled>⬇ Export selected</button>
        <button class="primary" id="export">⬇ Export all to Excel</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th><input type="checkbox" id="all" title="Select all"></th><th>ID</th><th>Title</th><th>Severity</th><th>Status</th><th>Test case</th><th>Module</th><th>Tester</th><th>Created</th><th></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty hidden" id="empty">
        <b>No defects yet.</b>
        <ol>
          <li>Click the ClearBug button to open the side panel.</li>
          <li>Import your test cases and mark each step Pass or Fail.</li>
          <li>A failed step opens a bug report. You can also press Alt+Shift+B anytime.</li>
        </ol>
      </div>
    </div>
  </main>
  <script src="lib/exceljs.min.js"></script>
  <script type="module" src="defects.js"></script>
</body>
</html>
